courses:
  - title: "Python for Data Science (Master in Finance, PGE 5)"
    description: "Four sessions built around one question: could the bank have seen default coming? Students take 30,000 credit card records from raw file to defensible answer: import, clean, test, and check how much their own choices drive the results."
    links:
      - {label: "Slides & notebooks", url: "https://github.com/andreaguido/python-pge5", icon: "fa-brands fa-github"}
      - {label: "Setup guide", url: "/files/python-pge5-setup.html", icon: "fa-solid fa-screwdriver-wrench"}

  - title: "Data Science with Python"
    description: "An in-depth introduction to data science: handling complex data structures and using data to test theory."
    book: "VanderPlas, Python Data Science Handbook"
    links:
      - {label: "Course materials", url: "https://github.com/andreaguido/datasciencewithpython", icon: "fa-brands fa-github"}

  - title: "Applied Information Analysis (Microeconometrics)"
    description: "Advanced microeconometric techniques for individual-level data, with an emphasis on practical skills in R and real-world applications."
    book: "Wooldridge, Introductory Econometrics"
    links:
      - {label: "Course materials", url: "https://github.com/andreaguido/microeconometrics", icon: "fa-brands fa-github"}

