working_papers:
  - key: grimalda_guido_trust
    title: "Accounting for Italy's North–South divide in trusting behaviour: Experimental evidence from Southern migrants"
    authors: [Gianluca Grimalda, Andrea Guido]
    year: 2026
    note: "Under review"
    pdf: /files/papers/grimalda-guido-trust-migrants.pdf
    topics: [norms, beliefs]
    abstract: >-
      Regional economic divides often persist despite free mobility, a puzzle attributed to gaps in trust
      and cooperation preferences. We study Italy's North–South trust divide to test whether such differences
      dissolve after migration to a higher-trust region. Using trust-game data from a Northern Italian province,
      we compare natives, Southern migrants, and other-region migrants: Southern migrants trust 29% less than
      natives, while other migrants are indistinguishable from them. The gap reflects both more pessimistic
      beliefs about others' cooperation and lower trustworthiness, with beliefs playing the larger role. Trust
      does not converge toward natives' levels with time since migration, suggesting persistent cultural traits.

  - key: guido_making_information_stick
    title: "Making information stick: Goal setting and attention"
    authors: [Andrea Guido, Rustam Romaniuc, Kene Boun My, Eugen Dimant, Dimitri Dubois, Michela Chessa, Danièle Fares, Xavier Gassmann, Andrea Martinangeli, Eli Spiegelman, Angela Sutan, Arnaud Brun, Laurence Dhaleine]
    year: 2026
    note: "Under review"
    pdf: /files/papers/guido-making-information-stick.pdf
    podcast: /files/podcast-soft-commitments.mp3
    topics: [nudges, env]
    abstract: >-
      Organizations are increasingly held accountable for the emissions their customers generate in using their
      products, yet the instrument they most often deploy — information provision — tends to raise awareness
      without changing behavior. We argue that this behavioral issue reflects limited attention: individuals
      attribute low instrumental value to the information and stop attending to it. Pursuing a goal, by contrast,
      may increase the perceived value of that information, sustaining attention and improving recall. We test
      this idea in a pre-registered field experiment (N=830), with a major European telecommunications operator,
      on offloading — i.e., switching internet use from mobile to Wi-Fi networks — which lowers the emissions of
      data use. While information provision alone does not produce any significant change in consumption
      behavior, the addition of goal setting increases attention in the short run and recall in the long run.
      These effects together increased the Wi-Fi share of total data consumption by about five percentage points
      (0.18 s.d.), without altering total data use. This behavioral shift towards cleaner networks persists after
      the intervention ends. Evidence from a follow-up survey indicates that this change is not due to
      alternative mechanisms, such as automated data management technologies, thereby lending support to
      theories of rational inattention. Self-set goals offer firms a low-cost, scalable design feature to reduce
      use-phase emissions without curtailing the service customers value.

  - key: andrighetto_guido_dg_norms
    title: "What motivates giving in Dictator Games? Estimating the role of social norms and preferences"
    authors: [Giulia Andrighetto, Andrea Guido, Eugenia Polizzi di Sorrentino, Aron Szekely]
    year: 2026
    note: "Under review"
    pdf: /files/papers/andrighetto-guido-giving-dg-norms.pdf
    topics: [norms]
    abstract: >-
      Altruistic cooperation is well documented in laboratory and field settings, yet the motivations that
      sustain it remain debated. Two leading explanations emphasize outcome-based social preferences and social
      norms, with the former focusing on distributional outcomes and the latter on compliance with socially
      appropriate action. We systematically study the relative importance of these competing explanations by
      conducting structural estimation on a dataset constructed by combining individual-level data from
      Dictator Game experiments. Additionally, we study the role of social norm strength — the extent to which
      social norms are clearly defined and widely shared — in translating what should be done into action. We
      find that generosity in Dictator Games is jointly determined by outcome-based social preferences and
      social norms, and that the influence of social norms on behaviour is strongly associated with their
      strength.

chapters:
  - key: guido_fares_2026
    title: "Using experiments to study mental models"
    authors: [Andrea Guido, Danièle Fares]
    year: 2026
    pdf: /files/papers/guido-fares-2026-mental-models.pdf
    topics: [beliefs]
    abstract: >-
      Decision-makers in organizations rely on causal representations of how their actions translate into
      outcomes — mental models — to navigate complex policy environments. Understanding these models is central
      to organizational cognition, yet observational methods can document what models people hold without
      establishing how they form, which model is selected when several are consistent with the same evidence,
      or what shifts them. Experiments fill this gap: by controlling the information environment and varying
      causal structures, they allow researchers to identify which models are activated, why some are adopted
      over others, and how they respond to persuasion. This chapter reviews the experimental evidence along
      these three dimensions. Together, the findings suggest that organizational interventions targeting
      behavior directly may fail if they leave the underlying causal representation unchanged.

publications:
  - key: guido2025nudging
    title: "Nudging or nagging: The perils of persuasion"
    authors: [Andrea Guido, Denis Tverskoi, Sergey Gavrilets, Ángel Sánchez, Giulia Andrighetto]
    journal: Journal of Economic Behavior & Organization
    year: 2025
    volume: 240
    pages: "107293"
    doi: 10.1016/j.jebo.2025.107293
    pdf: /files/papers/guido-2025-nudging-or-nagging.pdf
    materials:
      - {label: "Data & scripts", url: "https://researchbox.org/4590", type: data}
      - {label: "Experiment code (oTree)", url: "https://github.com/andreaguido/EVO_NORMS", type: code}
    topics: [nudges, env]
    abstract: >-
      Over the past few years, policy-makers have enthusiastically resorted to mass persuasion to promote
      behavioral change. However, the one-size-fit-all approach adopted by most policy-makers has often been
      criticized for leading to more heterogeneous and undesired behavior. A central unanswered question is
      whether the effect of persuasion depends on individuals' predisposition to follow externally-imposed rules.
      We provide experimental evidence on the heterogeneous effect of persuasion in a collective action problem.
      By studying the effect of appeals in an online experiment, we find that rule followers comply with the
      content of the appeal, while rule breakers react against it. Reactance to appeals among rule breakers
      emerges after some time and is robust even after controlling for social preferences, personal and social
      norms. Persuasive appeals have no overall effect on welfare, yet they introduce distributional disparities.
      Our findings raise awareness about the importance of individual heterogeneity when designing and
      evaluating behavioral interventions.

  - key: guido2025comparison
    title: "A comparison of endogenous and exogenous group formation to increase cooperation"
    authors: [Andrea Guido, Louis Putterman, Rustam Romaniuc]
    journal: Journal of Behavioral and Experimental Economics
    year: 2025
    volume: 119
    pages: "102451"
    doi: 10.1016/j.socec.2025.102451
    pdf: /files/papers/guido-2025-group-formation.pdf
    materials:
      - {label: "Experiment code (oTree)", url: "https://github.com/andreaguido/Endogenous_Exogenous_Group_Formation", type: code}
      - {label: "Pre-registration", url: "https://aspredicted.org/zi95w.pdf", type: prereg}
    topics: [norms]
    abstract: >-
      Grouping cooperatively disposed subjects with one another has been shown to slow the decline of
      contributions in public goods games. So far, similar findings have been obtained both when groups are
      exogenously formed by the experimenter and when they are endogenously formed by algorithms taking subjects'
      preferences for partners into account. We designed an experiment in which internally homogeneous groups –
      composed of like-minded subjects – can form either exogenously or endogenously, testing the conjecture that
      endogenously formed groups of cooperators will outperform similar exogenously formed groups due to
      subjects' decision rights in the endogenous procedure. We find that the conjecture is not supported,
      discussing potential explanations.

  - key: guido2025reference
    title: "Reference dependence and the role of information frictions"
    authors: [Andrea Guido, Alejandro Martínez-Marquina, Ryan Rholes]
    journal: Journal of Economic Behavior & Organization
    year: 2025
    volume: 237
    pages: "107169"
    doi: 10.1016/j.jebo.2025.107169
    pdf: /files/papers/guido-2025-reference-dependence.pdf
    materials:
      - {label: "Experiment code (oTree)", url: "https://github.com/andreaguido/LaborMarketExperiment", type: code}
    topics: [markets, beliefs]
    abstract: >-
      We introduce positive and negative endowment shocks and information frictions into an experimental labor
      market and study how firms share these with workers. Workers evaluate wages consistently with a reference
      wage, demanding higher (lower) wages but exerting the same effort when a positive (negative) shock is
      common knowledge. Their wage expectations adjust instantaneously to new information but sluggishly and
      asymmetrically when unaware of the shock. Firms form accurate beliefs about how shocks and information
      reshape effort responses and act on their beliefs, almost optimally in all scenarios. Our results suggest a
      limited role for other-regarding preferences and can be rationalized by a selfish firm best responding to
      a worker evaluating wages according to a reference wage.

  - key: romaniuc2025limits
    title: "The limits of behavioral nudges to increase youth turnout: Experimental evidence from two French elections"
    authors: [Rustam Romaniuc, Andrea Guido, Pierre Baudry, Cécile Bazart, Loïc Berger, Noémi Berlin, Aurélie Bonein, Imen Bouhlel, Kene Boun My, Michela Chessa, Paolo Crosetto, Etienne Dagorn, Quentin David, Étienne Farvaque, Agnès Festré, Abel François, Lisette Ibanez, Herrade Igersheim, Nicolas Jacquemet, Isabelle Lebon, Mathieu Lefebvre, Olivier L'Haridon, Danlin Li, Youenn Lohéac, Stéphane Luchini, Laurent Muller, Matthieu Pourieux, Elven Priour, Sébastien Roussel, Petros G. Sekeris, Maïté Stéphan, Eli Spiegelman, Angela Sutan, Uyanga Turmunkh, Laurence Vardaxoglou, Marc Willinger, Dimitri Dubois]
    with: "Rustam Romaniuc, Dimitri Dubois, and 34 coauthors"
    journal: Journal of Economic Behavior & Organization
    year: 2025
    volume: 236
    pages: "107098"
    doi: 10.1016/j.jebo.2025.107098
    pdf: /files/papers/romaniuc-2025-youth-turnout.pdf
    materials:
      - {label: "Data & replication package", url: "https://researchbox.org/4116", type: data}
      - {label: "Pre-registration (presidential)", url: "https://aspredicted.org/BK7_VP4", type: prereg}
      - {label: "Pre-registration (legislative)", url: "https://aspredicted.org/n7tw-4dwv.pdf", type: prereg}
    topics: [nudges]
    abstract: >-
      There is a significant gap in turnout between young people and older voters. The failure to instill a
      voting habit at an early age may have long term consequences in terms of future political participation
      as well as on other civic behaviors. Using a pre-registered online experiment with 3790 subjects, we
      implemented behavioral interventions aiming to stimulate youth turnout in the 2022 French presidential
      election. We rely on an innovative incentive scheme to measure their consequences on (self-reported)
      actual voting behavior. We also provide evidence on the effect of one behavioral intervention on youth
      turnout in a less salient election, the French legislative election that took place two months after the
      Presidential one. The results from the two experiments show the absence of any differences in turnout
      between the baseline and the treatment conditions. We investigate several mechanisms that can explain our
      results.

  - key: attanasi2025raising
    title: "Raising environmental awareness with augmented reality"
    authors: [Giuseppe Attanasi, Barbara Buljat Raymond, Agnès Festré, Andrea Guido]
    journal: Ecological Economics
    year: 2025
    volume: 233
    pages: "108563"
    doi: 10.1016/j.ecolecon.2025.108563
    pdf: /files/papers/attanasi-2025-augmented-reality.pdf
    materials:
      - {label: "Data", url: "https://researchbox.org/3491", type: data}
    topics: [env, nudges]
    abstract: >-
      Individuals are often poorly informed about the environmental consequences of their actions.
      Informational campaigns are a widely used policy tool to address imperfect information. However, previous
      research suggests that simply providing information may be ineffective and fail to engage individuals. We
      investigate whether augmented reality (AR) can reduce psychological distance and promote pro-environmental
      behavior. In two incentivized experiments (laboratory and contextualized), we evaluate the effect of AR
      visualizations of marine plastic-pollution consequences on participants' psychological distance and
      donations to pro-environmental organizations. Our results show no significant impact of AR visualizations
      on psychological distance or donation levels in either setting. Interestingly, we document a general
      optimism regarding the effectiveness of immersive technologies as policy tools, highlighting a potential
      misalignment between public expectations and the actual effectiveness of these technologies.

