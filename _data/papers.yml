  - key: tverskoi2023disentangling
    title: "Disentangling material, social, and cognitive determinants of human behavior and beliefs"
    authors: [Denis Tverskoi, Andrea Guido, Giulia Andrighetto, Ángel Sánchez, Sergey Gavrilets]
    journal: Humanities and Social Sciences Communications
    year: 2023
    volume: 10
    doi: 10.1057/s41599-023-01745-4
    pdf: https://www.nature.com/articles/s41599-023-01745-4.pdf
    materials:
      - {label: "Experiment code (oTree)", url: "https://github.com/andreaguido/EVO_NORMS", type: code}
    topics: [norms, env, beliefs]
    abstract: >-
      In social interactions, human decision-making, attitudes, and beliefs about others coevolve. Their
      dynamics are affected by cost-benefit considerations, cognitive processes, and social influences by peers
      and by authorities. Here we attempt to disentangle some of this complexity by using an integrative
      mathematical modeling and a 35-day online behavioral experiment. We utilize data from a Common Pool
      Resources experiment with or without messaging promoting a group-beneficial level of resource extraction.
      We directly estimate the weights of different factors in decision-making and beliefs dynamics. We show
      that personal norms and conformity with expected peers' actions have the largest impact on decision-making
      while material benefits and normative expectations have smaller effects. Individuals behaving prosocially
      are characterized by higher weights of personal norms while antisocial types are more affected by
      conformity. Messaging greatly decreases the weight of personal norms while simultaneously increases the
      weight of conformity. Our results have implications for understanding and predicting social processes
      triggered by shocks and for designing policy interventions aiming to change behavior.

  - key: attanasi2021controlling
    title: "Controlling monopoly power in a double-auction market experiment"
    authors: [Giuseppe Attanasi, Kene Boun My, Andrea Guido, Mathieu Lefebvre]
    journal: Journal of Public Economic Theory
    year: 2021
    volume: 23
    number: 5
    pages: "1074--1101"
    doi: 10.1111/jpet.12504
    topics: [markets]
    abstract: >-
      There is robust evidence in the experimental economics literature showing that monopoly power is affected
      by trading institutions. In this paper, we study whether trading institutions themselves can shape agents'
      market behavior through the formation of anchors. We recreate experimentally five different double-auction
      market structures (perfect competition, perfect competition with quotas, cartel on price, cartel on price
      with quotas, and monopoly) in a within-subject design, varying the order of markets implementation. We
      investigate whether monopoly power endures the formation of price anchors emerged in previously implemented
      market structures. Results from our classroom experiments suggest that double-auction trading institutions
      succeed in preventing monopolists from exploiting their market power. Furthermore, the formation of price
      anchors in previously implemented markets negatively impacts on monopolists' power in later market
      structures.

  - key: andrighetto2020cooperation
    title: "Cooperation, response time, and social value orientation: A meta-analysis"
    authors: [Giulia Andrighetto, Valerio Capraro, Andrea Guido, Aron Szekely]
    journal: Proceedings of the Annual Meeting of the Cognitive Science Society
    year: 2020
    pdf: https://psyarxiv.com/cbakz/download
    url: https://doi.org/10.31234/osf.io/cbakz
    materials:
      - {label: "Analysis code", url: "https://github.com/andreaguido/cogsci2020", type: code}
    topics: [norms]
    abstract: >-
      Recent research at the cross between cognitive and social sciences is investigating the cognitive
      mechanisms behind cooperative decisions. One debated question is whether cooperative decisions are made
      faster than non-cooperative ones. Yet empirical evidence is still mixed. In this paper we explore the
      implications of individual heterogeneity in social value orientation for the effect of response time on
      cooperation. We conduct a meta-analysis of available experimental studies (n=8; treatments=16; 5,232
      subjects). We report two main results: (i) the relation between response time and cooperation is moderated
      by social value orientation, such that it is positive for individualist subjects and negative for
      prosocial subjects; (ii) the relation between response time and cooperation is partly mediated by
      extremity of choice. These results suggest that highly prosocial subjects are fast to cooperate, highly
      individualist subjects are fast to defect, and subjects with weaker preferences make slower and less
      extreme decisions.

  - key: guido2019group
    title: "Group formation and cooperation in social dilemmas: A survey and meta-analytic evidence"
    authors: [Andrea Guido, Andrea Robbett, Rustam Romaniuc]
    journal: Journal of Economic Behavior & Organization
    year: 2019
    volume: 159
    pages: "192--209"
    doi: 10.1016/j.jebo.2019.02.009
    pdf: /files/papers/guido-2019-group-formation-survey.pdf
    topics: [norms]
    abstract: >-
      We survey the growing literature on group formation in the context of three types of social dilemma games:
      public goods games, common pool resources, and the prisoner's dilemma. The 62 surveyed papers study the
      effect of different sorting mechanisms – endogenous, endogenous with the option to play the game, and
      exogenous – on cooperation rates. Our survey shows that cooperators are highly sensitive to the presence of
      free-riders, independently of the sorting mechanism. We complement the survey with a meta-analysis showing
      no difference in terms of cooperation between studies implementing an endogenous and exogenous sorting.
      What is more, we find that it is no more likely for a cooperator to be matched with like-minded partners in
      endogenously formed groups than in exogenously formed groups. As we show in the survey, the success of a
      sorting method in matching like-minded individuals and the levels of cooperation are closely interlinked.

