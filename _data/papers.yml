  - key: andrighetto2024changes
    title: "Changes in social norms during the early stages of the COVID-19 pandemic across 43 countries"
    authors: [Giulia Andrighetto, Aron Szekely, Andrea Guido, Michele Gelfand, others]
    with: "Giulia Andrighetto, Aron Szekely, Michele Gelfand, and 78 coauthors"
    journal: Nature Communications
    year: 2024
    volume: 15
    pages: "1436"
    doi: 10.1038/s41467-024-44999-5
    pdf: https://www.nature.com/articles/s41467-024-44999-5.pdf
    topics: [norms]
    abstract: >-
      The emergence of COVID-19 dramatically changed social behavior across societies and contexts. Here we
      study whether social norms also changed. Specifically, we study this question for cultural tightness (the
      degree to which societies generally have strong norms), specific social norms (e.g. stealing, hand
      washing), and norms about enforcement, using survey data from 30,431 respondents in 43 countries recorded
      before and in the early stages following the emergence of COVID-19. Using variation in disease intensity,
      we shed light on the mechanisms predicting changes in social norm measures. We find evidence that, after
      the emergence of the COVID-19 pandemic, hand washing norms increased while tightness and punishing
      frequency slightly decreased but observe no evidence for a robust change in most other norms. Thus, at
      least in the short term, our findings suggest that cultures are largely stable to pandemic threats except
      in those norms, hand washing in this case, that are perceived to be directly relevant to dealing with the
      collective threat.

  - key: pasin2024evidence
    title: "Evidence from 43 countries that disease leaves cultures unchanged in the short-term"
    authors: [Gian Luca Pasin, Aron Szekely, Kimmo Eriksson, Andrea Guido, Eugenia Polizzi di Sorrentino, Giulia Andrighetto]
    journal: Scientific Reports
    year: 2024
    volume: 14
    pages: "6502"
    doi: 10.1038/s41598-023-33155-6
    pdf: https://www.nature.com/articles/s41598-023-33155-6.pdf
    topics: [norms]
    abstract: >-
      Did cultures change shortly after, and in response to, the COVID-19 outbreak? If so, then in what way? We
      study these questions for a set of macro-cultural dimensions: collectivism/individualism, duty/joy,
      traditionalism/autonomy, and pro-fertility/individual-choice norms. We also study specific perceptions and
      norms like perceived threats to society (e.g. immigration) and hygiene norms. Using survey data from 29,761
      respondents, in 55 cities and 43 countries, collected before (April–December 2019) and recently after the
      emergence of COVID-19 (April–June 2020), we exploit variation in disease intensity across regions to test
      potential mechanisms behind any changes. The macro-cultural dimensions remained stable. In contrast,
      specific perceptions and norms related to the pandemic changed: norms of hygiene substantially increased as
      did perceived threats related to disease.

